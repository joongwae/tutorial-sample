name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  MVN_VERSION: "3.9.6"
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

permissions:
  security-events: write
  actions: read
  contents: read
  packages: read

jobs:
  pipeline:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        environment: [prod, uat]
        include:
          - branch: main
            environment: prod
          - branch: develop
            environment: uat

    environment:
      name: ${{ matrix.environment }}

    steps:
      - name: Start Pipeline
        run: |
          echo "Running pipeline for project in ${{ matrix.environment }}"
          echo "Branch: ${{ github.ref }}"

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "maven"

      - name: Set up Maven
        uses: stCarolas/setup-maven@v4
        with:
          maven-version: ${{ env.MVN_VERSION }}

      - name: Run Unit Tests
        run: |
          mvn clean test

      - name: Generate Unique Artifact Name
        id: artifact-name
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          TIMESTAMP=$(date +%Y%m%d_%H%M%S)
          echo "artifact_suffix=${SHORT_SHA}_${TIMESTAMP}" >> $GITHUB_OUTPUT

      - name: Archive Test Results
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ steps.artifact-name.outputs.artifact_suffix }}
          path: |
            **/target/surefire-reports/
            **/target/failsafe-reports/
          retention-days: 30

      - name: Archive and Fingerprint Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts-${{ steps.artifact-name.outputs.artifact_suffix }}
          path: |
            **/target/*.jar
          retention-days: 30

      # ... rest of your steps remain the same
      - name: Trivy Filesystem Security Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "sarif"
          output: "trivy-results.sarif"
          exit-code: 0

      - name: Build Docker Image
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            deployEnv="prod"
          elif [[ "${{ github.ref }}" == "refs/heads/develop" ]]; then
            deployEnv="uat"
          else
            deployEnv="dev"
          fi

          SHORT_SHA=$(git rev-parse --short HEAD)
          BUILD_VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)

          DOCKER_IMAGE_TAG="${{ secrets.DOCKERHUB_USERNAME }}/${{ github.event.repository.name }}:${deployEnv}-${SHORT_SHA}-${BUILD_VERSION}"

          echo "DOCKER_IMAGE_TAG=${DOCKER_IMAGE_TAG}" >> $GITHUB_ENV

          mvn clean spring-boot:build-image \
            -DskipTests \
            -DdockerImageName=${DOCKER_IMAGE_TAG}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Docker Image
        run: |
          docker push ${{ env.DOCKER_IMAGE_TAG }}

      - name: Docker Image Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.DOCKER_IMAGE_TAG }}
          format: "sarif"
          output: "trivy-image-results.sarif"
          exit-code: 0

      - name: Upload Security Scan Results
        if: always()
        run: |
          # Upload filesystem scan results
          if [ -f "trivy-results.sarif" ]; then
            echo "Uploading filesystem scan results..."
            SARIF_BASE64=$(base64 -w0 trivy-results.sarif)
            curl -X POST \
              -H "Authorization: Bearer ${{ github.PAT_TOKEN }}" \
              -H "Accept: application/vnd.github.v3+json" \
              https://api.github.com/repos/${{ github.repository }}/code-scanning/sarifs \
              -d "{\"commit_sha\":\"${{ github.sha }}\",\"ref\":\"${{ github.ref }}\",\"sarif\":\"$SARIF_BASE64\"}"
          fi

          if [ -f "trivy-image-results.sarif" ]; then
            echo "Uploading Docker image scan results..."
            SARIF_BASE64=$(base64 -w0 trivy-image-results.sarif)
            curl -X POST \
              -H "Authorization: Bearer ${{ github.PAT_TOKEN }}" \
              -H "Accept: application/vnd.github.v3+json" \
              https://api.github.com/repos/${{ github.repository }}/code-scanning/sarifs \
              -d "{\"commit_sha\":\"${{ github.sha }}\",\"ref\":\"${{ github.ref }}\",\"sarif\":\"$SARIF_BASE64\"}"
          fi

      - name: Clean Up
        run: |
          docker system prune -f
