name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  MVN_VERSION: "3.9.6"

permissions:
  security-events: write
  actions: read
  contents: read
  packages: write

jobs:
  pipeline:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        environment: [prod, uat]
        include:
          - branch: main
            environment: prod
          - branch: develop
            environment: uat

    environment:
      name: ${{ matrix.environment }}

    steps:
      - name: Start Pipeline
        run: |
          echo "Running pipeline for project in ${{ matrix.environment }}"
          echo "Branch: ${{ github.ref }}"

      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "maven"

      - name: Set up Maven
        uses: stCarolas/setup-maven@v5
        with:
          maven-version: ${{ env.MVN_VERSION }}

      - name: Build Application and Run Tests
        run: |
          mvn clean package
        env:
          MAVEN_OPTS: -Dmaven.test.failure.ignore=false

      - name: Generate Unique Artifact Name
        id: artifact-name
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          TIMESTAMP=$(date +%Y%m%d_%H%M%S)
          echo "artifact_suffix=${SHORT_SHA}_${TIMESTAMP}" >> $GITHUB_OUTPUT

      - name: Archive Test Results
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ steps.artifact-name.outputs.artifact_suffix }}
          path: |
            **/target/surefire-reports/
            **/target/failsafe-reports/
          retention-days: 30

      - name: Archive and Fingerprint Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts-${{ steps.artifact-name.outputs.artifact_suffix }}
          path: |
            **/target/*.jar
            **/target/*.war
          retention-days: 30

      - name: Trivy Filesystem Security Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "sarif"
          output: "trivy-results.sarif"
          exit-code: 0

      - name: Upload Trivy Filesystem scan results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: "trivy-results.sarif"
          category: "trivy-filesystem"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push OCI Image to GHCR
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            deployEnv="prod"
          elif [[ "${{ github.ref }}" == "refs/heads/develop" ]]; then
            deployEnv="uat"
          else
            deployEnv="dev"
          fi

          SHORT_SHA=$(git rev-parse --short HEAD)
          TIMESTAMP=$(date +%Y%m%d%H%M%S)

          # GHCR image naming
          GHCR_IMAGE_NAME="ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}"
          DOCKER_IMAGE_TAG="${GHCR_IMAGE_NAME}:${deployEnv}-${SHORT_SHA}-${TIMESTAMP}"
          LATEST_TAG="${GHCR_IMAGE_NAME}:${deployEnv}-latest"

          echo "DOCKER_IMAGE_TAG=${DOCKER_IMAGE_TAG}" >> $GITHUB_ENV
          echo "LATEST_TAG=${LATEST_TAG}" >> $GITHUB_ENV

          # Build OCI image directly to GHCR using Spring Boot Maven plugin
          mvn spring-boot:build-image \
            -DskipTests \
            -Dspring-boot.build-image.imageName=${DOCKER_IMAGE_TAG} \
            -Dspring-boot.build-image.publish=true \
            -Dspring-boot.build-image.verboseLogging=true

          # Tag and push latest using Docker CLI (since Maven plugin built and published the main tag)
          docker pull ${DOCKER_IMAGE_TAG}
          docker tag ${DOCKER_IMAGE_TAG} ${LATEST_TAG}
          docker push ${LATEST_TAG}

      - name: Docker Image Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.DOCKER_IMAGE_TAG }}
          format: "sarif"
          output: "trivy-image-results.sarif"
          exit-code: 0

      - name: Upload Docker scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: "trivy-image-results.sarif"
          category: "trivy-container"

      - name: Output Image Information
        run: |
          echo "Successfully built and pushed OCI images to GHCR:"
          echo "Specific version: ${{ env.DOCKER_IMAGE_TAG }}"
          echo "Latest for environment: ${{ env.LATEST_TAG }}"

          echo "To pull the image, use:"
          echo "docker pull ${{ env.DOCKER_IMAGE_TAG }}"

          echo "Image digest information:"
          docker inspect ${{ env.DOCKER_IMAGE_TAG }} --format='{{.RepoDigests}}'

      - name: Clean Up
        run: |
          docker system prune -f
